<html lang="en">
<head>
<meta charset="utf-8">
<title>Automations — Noop Ridge</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[aria-label^="Back"]');if(a&&history.length>1){e.preventDefault();e.stopPropagation();history.back();}},true);</script>
<link rel="stylesheet" href="noop-tokens.css">
<link rel="stylesheet" href="ds/noopridge/components/bundle.css">
<script src="ds/noopridge/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Playfair+Display:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#131f26;font-family:Inter,system-ui,sans-serif;color:#f5efe4}
a{color:#59ecaa}a:hover{color:#8ff3c6}
.np-scroll{scrollbar-width:none}.np-scroll::-webkit-scrollbar{display:none}
.np-plain{text-decoration:none;color:inherit}
.np-step{width:36px;height:36px;border-radius:50%;border:1px solid rgba(190,220,235,.2);background:rgba(170,205,220,.06);color:#f5efe4;display:grid;place-items:center;cursor:pointer;padding:0;font:600 16px/1 Inter,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg-100); color: var(--ink); font-family: var(--font-sans)">
<div class="np-scroll" style="position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden">
<div style="position: relative; min-height: 100%; background: radial-gradient(120% 40% at 50% 0%, rgba(107, 161, 253, 0.16), rgba(19, 31, 38, 0) 70%)">
<div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 48px">

<header style="display: flex; align-items: center; gap: 8px">
<a href="More.dc.html" aria-label="Back to Hub" class="np-plain" style="width: 44px; height: 44px; margin-left: -6px; border-radius: 50%; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font: 700 30px/34px var(--font-display)">Automations</h1><span style="font: 500 13px/18px var(--font-sans); color: var(--ink-muted)">Tap to act, walk away to lock, train by feel.</span></div>
</header>

<sc-for list="{{ sections }}" as="g" hint-placeholder-count="7">
<section class="nr-glass" style="border-radius: var(--radius-lg); overflow: hidden">
<button type="button" onClick="{{ g.toggle }}" aria-expanded="{{ g.open }}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 16px; border: 0; background: none; cursor: pointer; color: var(--ink); text-align: left">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="nr-eyebrow" style="font-size: 9px">Automation</span><span style="font: 600 16px/20px var(--font-sans)">{{ g.title }}</span></span>
<sc-if value="{{ g.anyOn }}" hint-placeholder-val="{{ true }}"><span class="nr-chip nr-chip-live" style="height: 24px; font-size: 10px">ON</span></sc-if>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-subtle)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ g.chev }}"></path></svg>
</button>
<sc-if value="{{ g.open }}" hint-placeholder-val="{{ false }}">
<div style="padding: 0 16px 8px">
<sc-for list="{{ g.items }}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-top: 1px solid var(--glass-stroke)"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font: 500 15px/20px var(--font-sans)">{{ t.label }}</span><span style="font: 400 12px/16px var(--font-sans); color: var(--ink-muted)">{{ t.sub }}</span></span><button type="button" role="switch" aria-checked="{{ t.on }}" aria-label="{{ t.label }}" onClick="{{ t.flip }}" style="{{ t.track }}"><span style="{{ t.knob }}"></span></button></div>
</sc-for>
<sc-if value="{{ g.isTap }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--glass-stroke)"><span style="font: 500 15px/20px var(--font-sans)">When I double-tap</span><div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{ taps }}" as="x" hint-placeholder-count="5"><button type="button" onClick="{{ x.pick }}" aria-pressed="{{ x.on }}" style="{{ x.style }}">{{ x.label }}</button></sc-for></div><button type="button" onClick="{{ testTap }}" class="nr-btn nr-btn-secondary" style="align-self: flex-start">{{ testLabel }}</button></div>
</sc-if>
<sc-if value="{{ g.isIdle }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid var(--glass-stroke)"><span style="flex-grow: 1; font: 500 15px/20px var(--font-sans)">Sitting for</span><button type="button" class="np-step" aria-label="Less" onClick="{{ sitDown }}">−</button><span style="min-width: 58px; text-align: center; font: 700 16px/20px var(--font-display)">{{ sit }} min</span><button type="button" class="np-step" aria-label="More" onClick="{{ sitUp }}">+</button></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-top: 1px solid var(--glass-stroke)"><span style="font: 500 15px/20px var(--font-sans)">Active hours</span><span style="font: 700 16px/20px var(--font-display)">08:00 – 20:00</span></div>
</sc-if>
<sc-if value="{{ g.isNap }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; padding: 4px 0; border-top: 1px solid var(--glass-stroke)"><span class="nr-eyebrow" style="padding: 10px 0 4px">Review detected naps</span>
<sc-if value="{{ noNaps }}" hint-placeholder-val="{{ false }}"><span style="padding: 8px 0; font: 400 13px/19px var(--font-sans); color: var(--ink-muted)">No naps to review. Detected naps show up here after a history sync.</span></sc-if>
<sc-for list="{{ naps }}" as="n" hint-placeholder-count="2"><div style="display: flex; align-items: center; gap: 8px; min-height: 48px"><span style="flex-grow: 1; font: 500 14px/18px var(--font-sans)">{{ n.t }}</span><button type="button" onClick="{{ n.ok }}" aria-label="Accept nap" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(89,236,170,0.5); background: none; color: var(--brand); cursor: pointer; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button><button type="button" onClick="{{ n.no }}" aria-label="Dismiss nap" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(190,220,235,0.3); background: none; color: var(--ink-muted); cursor: pointer; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></sc-for>
</div>
</sc-if>
</div>
</sc-if>
</section>
</sc-for>

<a href="Alarms.dc.html" class="nr-glass np-plain" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-lg)"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 15px/20px var(--font-sans)">Alarms</span><span style="font: 400 12px/16px var(--font-sans); color: var(--ink-muted)">Smart wake, strap buzz and wind-down</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-subtle)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>

</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

var G = [

['tap', 'Double-tap', []],
['coach', 'Haptic coaching', [mk('zone', 'HR-zone coaching', 'Buzz when you cross a zone'), mk('recBuzz', 'Recovery buzz', 'A buzz when you drop back to Zone 1')]],
['idle', 'Inactivity reminder', [mk('idle', 'Remind me to move', 'A gentle buzz after sitting'), mk('activeOnly', 'Only during active hours', 'Never at night')]],

</body>
</html>
