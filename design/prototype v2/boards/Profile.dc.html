<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-000:#0c161c;--bg-100:#131f26;--bg-200:#172630;--bg-300:#1f313b;--bg-400:#283d48;--glass-fill:#aacddc0f;--glass-fill-strong:#aacddc1a;--glass-stroke:#bedceb24;--glass-highlight:#ffffff24;--ink:#f5efe4;--ink-muted:#b6c3ca;--ink-subtle:#9dadb6;--ink-on-liquid:#0c161c;--brand:#59ecaa;--brand-deep:#1f8a5e;--charge:#e8b84f;--charge-deep:#9a6a18;--effort:#6ba1fd;--effort-deep:#2c5bbd;--rest:#59ecaa;--rest-deep:#1f8a5e;--battery:#2f9a62;--battery-deep:#15512f;--state-depleted:#f7777d;--state-low:#f39a5b;--state-moderate:#e8c46a;--state-good:#a6dc7e;--state-ready:#59ecaa;--data-hrv:#b8a3ff;--data-heart:#ff8198;--data-energy:#ffb45e;--data-breath:#58d7c9;--focus-ring:#f5efe4;--shadow-card:0 12px 32px rgba(2, 6, 16, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);--glow-charge:0 0 28px rgba(232, 184, 79, 0.35);--glow-effort:0 0 28px rgba(107, 161, 253, 0.35);--glow-rest:0 0 28px rgba(89, 236, 170, 0.35);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--radius-sm:10px;--radius-md:18px;--radius-lg:24px;--radius-xl:32px;--radius-pill:999px;--radius-orb:50%;--blur-glass:20px;--font-display:"Playfair Display", Georgia, serif;--font-sans:Inter, "SF Pro Display", system-ui, sans-serif;--font-script:Allura, "Snell Roundhand", cursive;--text-numeral-xl:700 60px/1 var(--font-display);--text-numeral-lg:700 44px/1 var(--font-display);--text-title-xl:700 40px/44px var(--font-display);--text-title-lg:700 30px/34px var(--font-display);--text-numeral-md:700 28px/32px var(--font-display);--text-body:400 15px/22px var(--font-sans);--text-body-sm:500 13px/18px var(--font-sans);--text-label:600 13px/16px var(--font-sans);--text-eyebrow:600 11px/14px var(--font-sans);--text-button:600 14px/20px var(--font-sans);--text-tab:500 11px/14px var(--font-sans);--text-wordmark:300 22px/24px var(--font-sans);--text-tagline:500 10px/14px var(--font-sans);--text-script:400 26px/26px var(--font-script);}}</style>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile — Noop Ridge</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[aria-label^="Back"]');if(a&&history.length>1){e.preventDefault();e.stopPropagation();history.back();}},true);</script>
<link rel="stylesheet" href="noop-tokens.css">
<link rel="stylesheet" href="ds/noopridge/components/bundle.css">
<script src="ds/noopridge/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Playfair+Display:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#131f26;font-family:Inter,system-ui,sans-serif;color:#f5efe4}
a{color:#59ecaa}a:hover{color:#8ff3c6}
.np-scroll{scrollbar-width:none}.np-scroll::-webkit-scrollbar{display:none}
.np-plain{text-decoration:none;color:inherit}
.np-step{width:40px;height:40px;border-radius:50%;border:1px solid rgba(190,220,235,.2);background:rgba(170,205,220,.06);color:#f5efe4;display:grid;place-items:center;cursor:pointer;padding:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg-100); color: var(--ink); font-family: var(--font-sans)">
<div class="np-scroll" style="position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden">
<div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 48px">

<header style="display: flex; align-items: center; gap: 8px">
<a href="More.dc.html" aria-label="Back to Hub" class="np-plain" style="width: 44px; height: 44px; margin-left: -6px; border-radius: 50%; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="nr-eyebrow">You</span><h1 style="margin: 0; font: 700 30px/34px var(--font-display)">Profile</h1></div>
</header>

<p style="margin: 0; font: 400 14px/21px var(--font-sans); color: var(--ink-muted)">These power your heart-rate zones, calorie estimates and recovery baselines. Keep them accurate.</p>

<section class="nr-glass" style="border-radius: var(--radius-lg); padding: 2px 18px">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<div style="{{ r.wrap }}">
<sc-if value="{{ r.isStep }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 10px; min-height: 48px">
<span style="flex-grow: 1; font: 500 16px/21px var(--font-sans)">{{ r.label }}</span>
<span style="display: inline-flex; align-items: baseline; gap: 6px; min-width: 76px; justify-content: flex-end"><span style="font: 600 18px/22px var(--font-sans); font-variant-numeric: lining-nums; {{ r.vStyle }}">{{ r.value }}</span><span style="font: 400 13px/16px var(--font-sans); color: var(--ink-muted)">{{ r.unit }}</span></span>
<button type="button" class="np-step" aria-label="{{ r.decAria }}" onClick="{{ r.dec }}" style="{{ r.dis }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<button type="button" class="np-step" aria-label="{{ r.incAria }}" onClick="{{ r.inc }}" style="{{ r.dis }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</sc-if>
<sc-if value="{{ r.isSeg }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; min-height: 48px"><span style="{{ r.labStyle }}">{{ r.label }}</span>
<div role="group" aria-label="{{ r.label }}" style="{{ r.segWrap }}">
<sc-for list="{{ r.opts }}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="{{ o.style }}"><sc-if value="{{ o.heart }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></sc-if>{{ o.label }}</button></sc-for>
</div></div>
</sc-if>
<sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; min-height: 56px"><span style="flex-grow: 1; font: 500 16px/21px var(--font-sans)">{{ r.label }}</span><button type="button" role="switch" aria-checked="{{ r.on }}" aria-label="{{ r.label }}" onClick="{{ r.flip }}" style="{{ r.track }}"><span style="{{ r.knob }}"></span></button></div>
</sc-if>
<sc-if value="{{ r.isLink }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ r.tap }}" style="width: 100%; display: flex; align-items: center; gap: 8px; min-height: 48px; background: transparent; border: 0; padding: 0; color: inherit; font-family: inherit; cursor: pointer; text-align: left"><span style="flex-grow: 1; font: 500 16px/21px var(--font-sans)">{{ r.label }}</span><span style="font: 400 13px/18px var(--font-sans); color: var(--ink-muted)">{{ r.value }}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-subtle)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</sc-if>
<sc-if value="{{ r.hasSub }}" hint-placeholder-val="{{ false }}"><span style="{{ r.subStyle }}">{{ r.sub }}</span></sc-if>
</div>
</sc-for>
</section>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { age: 32, sex: 0, weight: 82.5, src: 0, hcW: 82.1, height: 182, waist: null, mhr: null, zones: false, cal: 1.0 };
}
renderVals() {
var self = this, s = this.state;
var hc = s.src === 1;
var sw = function (on) { return { track: 'position: relative; width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; border: 0; padding: 0; cursor: pointer; background: ' + (on ? '#59ecaa' : 'rgba(190,220,235,0.22)') + ';', knob: 'position: absolute; top: 4px; left: ' + (on ? 24 : 4) + 'px; width: 24px; height: 24px; border-radius: 50%; background: ' + (on ? '#0c161c' : '#f5efe4') + ';' }; };
var pill = function (on) { return 'flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 999px; height: 36px; padding: 0 12px; cursor: pointer; white-space: nowrap; font: 600 14px/16px Inter, sans-serif; ' + (on ? 'background: #59ecaa; color: #0c161c;' : 'background: transparent; color: #b6c3ca;'); };
var line = 'border-top: 1px solid rgba(190,220,235,0.14); padding: 6px 0;';
var first = 'padding: 10px 0 6px;';
var subS = 'display: block; padding: 0 0 12px; font: 400 12px/17px Inter, sans-serif; color: #9dadb6;';
var base = { isStep: false, isSeg: false, isToggle: false, isLink: false, hasSub: false, vStyle: '', unit: '', dis: '', labStyle: 'flex-shrink: 0; font: 500 16px/21px Inter, sans-serif;', segWrap: 'flex: 1; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(170,205,220,0.06); border: 1px solid rgba(190,220,235,0.2);' };
var R = function (o) { return Object.assign({}, base, o); };
var step = function (label, value, unit, dec, inc, extra) { return R(Object.assign({ isStep: true, label: label, value: value, unit: unit, dec: dec, inc: inc, decAria: 'Decrease ' + label.toLowerCase(), incAria: 'Increase ' + label.toLowerCase() }, extra || {})); };
var seg = function (label, names, cur, pick, extra) { return R(Object.assign({ isSeg: true, label: label, opts: names.map(function (n, i) { return { label: n.t || n, heart: !!n.h, on: cur === i, style: pill(cur === i), pick: function () { pick(i); } }; }) }, extra || {})); };
var set = function (k, v) { var o = {}; o[k] = v; self.setState(o); };
var tr = sw(s.zones), rows = [];
rows.push(step('Age', String(s.age), '', function () { set('age', Math.max(13, s.age - 1)); }, function () { set('age', Math.min(99, s.age + 1)); }));
rows.push(seg('Sex', ['Male', 'Female', 'Non-binary'], s.sex, function (i) { set('sex', i); }));
var w = hc ? s.hcW : s.weight;
rows.push(step('Weight', w.toFixed(1), 'kg', function () { set('weight', Math.round((s.weight - 0.1) * 10) / 10); }, function () { set('weight', Math.round((s.weight + 0.1) * 10) / 10); }, { dis: hc ? 'opacity: .35; pointer-events: none;' : '' }));
rows.push(seg('SOURCE', ['Manual', { t: 'Health Connect', h: true }], s.src, function (i) { set('src', i); }, { labStyle: 'flex-shrink: 0; width: 70px; font: 500 12px/16px Inter, sans-serif; letter-spacing: 0.16em; color: #b6c3ca;', hasSub: hc, sub: 'Latest weight in Health Connect · today 07:42. Switch to Manual to type your own.', subStyle: subS + ' padding-top: 6px;' }));
rows.push(step('Height', String(s.height), 'cm', function () { set('height', s.height - 1); }, function () { set('height', s.height + 1); }));
rows.push(step('Waist (optional)', s.waist ? String(s.waist) : 'Add', s.waist ? 'cm' : '', function () { set('waist', s.waist ? s.waist - 1 : 84); }, function () { set('waist', s.waist ? s.waist + 1 : 84); }, { vStyle: s.waist ? '' : 'color: #b6c3ca; font-weight: 500;', hasSub: true, sub: 'Optional · VO₂max builds from ~4 nights of heart rate; a waist makes it more accurate. The Fitness Age itself doesn’t need it. Measure around your middle, at the navel.', subStyle: subS }));
var auto = Math.round(208 - 0.7 * s.age);
rows.push(step('Max heart rate', s.mhr ? String(s.mhr) : 'Auto', 'bpm', function () { set('mhr', (s.mhr || auto) - 1); }, function () { set('mhr', (s.mhr || auto) + 1); }, { vStyle: s.mhr ? '' : 'color: #59ecaa;', hasSub: true, sub: s.mhr ? 'Manual · tap − until it reads Auto' : 'Auto · ' + auto + ' bpm (Tanaka)', subStyle: subS + ' text-align: right;' }));
rows.push(R({ isToggle: true, label: 'Custom HR zones', on: s.zones, track: tr.track, knob: tr.knob, flip: function () { set('zones', !s.zones); } }));
rows.push(step('Step calibration', s.cal.toFixed(1), '', function () { set('cal', Math.max(0.1, Math.round((s.cal - 0.1) * 10) / 10)); }, function () { set('cal', Math.min(30, Math.round((s.cal + 0.1) * 10) / 10)); }, { hasSub: true, sub: 'Counter ticks per step. Leave at 1.0 unless your steps run high. On a WHOOP 5/MG they can run very high (10× or more), so this goes up to 30. Walk a known 1,000 steps and divide NOOP’s count by the real count to get your value.', subStyle: subS }));
rows.push(R({ isLink: true, label: 'Steps estimate', value: 'Not calibrated', tap: function () {}, hasSub: true, sub: 'For a WHOOP 4.0, which sends no step count: NOOP estimates steps from motion, calibrated to your phone. Tap to see how close it is and adjust it.', subStyle: subS }));
rows.forEach(function (r, i) { r.wrap = i ? line : first; });
return { rows: rows };
}
}
</script>
</body>
</html>
