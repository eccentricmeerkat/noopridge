<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome — Noop Ridge</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="noop-tokens.css">
<link rel="stylesheet" href="ds/noopridge/components/bundle.css">
<script src="ds/noopridge/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Playfair+Display:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#131f26;font-family:Inter,system-ui,sans-serif;color:#f5efe4}
.np-plain{text-decoration:none;color:inherit}
@keyframes npSpin{to{transform:rotate(360deg)}}
@keyframes npRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.np-spin{width:36px;height:36px;border-radius:50%;border:2px solid rgba(245,239,228,.18);border-top-color:#f5efe4;border-right-color:#f5efe4;animation:npSpin 1.1s linear infinite;filter:drop-shadow(0 0 6px rgba(245,239,228,.5))}
.np-rise{animation:npRise .9s ease-out both}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #131f26 url('welcome-bg.jpg') center / cover no-repeat; color: var(--ink); font-family: var(--font-sans)">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(19, 31, 38, 0.15), rgba(19, 31, 38, 0) 40%, rgba(19, 31, 38, 0.55) 100%)"></div>

<div class="np-rise" style="position: absolute; left: 24px; right: 24px; top: 140px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span style="font: 400 26px/32px var(--font-display); color: rgba(245, 239, 228, 0.92); text-shadow: 0 2px 14px rgba(10, 20, 30, 0.3); font-weight: 700">Welcome to</span>
<h1 style="margin: 0; line-height: 0"><img src="ridge-logo.png" alt="Noop Ridge" width="310" height="88" style="display: block; width: 310px; height: auto"></h1>
<span style="font: 400 15px/22px var(--font-sans); color: var(--ink, #f5efe4)">Your WHOOP data, on your phone, on your terms.</span>
</div>

<sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}"><div class="np-spin" role="status" aria-label="Loading" style="position: absolute; left: 177px; bottom: 80px"></div></sc-if>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<a href="Intro.dc.html" class="nr-btn nr-btn-primary np-plain np-rise" style="position: absolute; z-index: 5; left: 55px; bottom: 72px; width: 280px; height: 52px; box-sizing: border-box; margin: 0; padding: 0; display: inline-flex; justify-content: center; align-items: center; color: var(--ink-on-liquid);">Get started</a>
<span class="np-rise" style="position: absolute; z-index: 5; left: 40px; right: 40px; bottom: 40px; text-align: center; font: 500 12px/16px var(--font-sans); color: rgba(245, 239, 228, 0.6)">Takes about 2 minutes · skip any time</span>
</sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); var self = this; this.state = { ready: false }; setTimeout(function () { self.setState({ ready: true }); }, 2400); }
renderVals() { return { loading: !this.state.ready, ready: this.state.ready }; }
}
</script>
</body>
</html>
